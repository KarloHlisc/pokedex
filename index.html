<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Fetch Pokemons from PokeAPI.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./assets/icons/poke_ball_icon.png"/>
    <title>Pokedex</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./styles/pokemon-colors.css" />
    <script src="./scripts/template.js"></script>
  </head>
  <body id="body" onload="init()">
    <header>
      <div class="pokemon-container">
        <div class="title-sestion">
          <div class="title-style-section">
         <div id="titlePokemon">     
           <h1>Pokémon</h1> <img  id="pokeballImage" src="./assets/icons/poke_ball_icon.png" alt="pokeball image">
         </div>
          <div class="input">
            <input  type="text" placeholder="Search Pokémon" aria-label="search-pokemon-input-field" data-id="search-input" id="searchText" minlength="3" required/> <!--onblur="canSearch()"-->
            <button id="searchBtn" onclick="searchArray()" >Search</button>
          </div>
          <div class="massage">
            <p id="text-massage-search"></p>
          </div>
         </div>
        </div>
      </div>
    </header>
    <main data-id="content">
     <div id="loading-overlay" class="loading-overlay"><div id="loading">
        <img src="./assets/icons/poke_ball_icon.png"  class="rotating" alt="Lädt...">
      </div>
      </div>
      <div class="pokemon-container">
        <section class="pokemon-section">
          <ul id="pokemon"></ul>
          <button onclick="loadMorePokemons()" id="load-btn">Load more</button>
        </section>
      </div>
      <dialog data-id="dialog" id="myDialog"  aria-label="pokemon-dialog" onclick="logDownBublingPropagation(event)" closedby="any"> <!--closedby="any"-->
        <div id="showDialogPokemon" onclick="logDownBublingPropagation(event)">
          <div class="dialog-header">
            <h2 id="pokemonName"></h2>
          </div>
          <section>
            <p id="text"></p>
          </section>
          <div class="dialog-footer">
            <button onclick="closeDialog()">Schließen</button>
          </div>
        </div>
      </dialog>
    </main>
    <footer>
      <section>
      <h3>Made by Karlo 2026</h3>
    </section>
  </footer>
    <script src="./script.js"></script>
    <link rel="stylesheet" href="./styles/dialog-tabs.css" />
    <link rel="stylesheet" href="styles/dialog.css" />
    <script src="./scripts/evolution-chain.js"></script>
  </body>
</html>
